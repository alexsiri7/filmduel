      - "GET /api/me/feedback/{id}/screenshot for the owner returns the decoded image with Cache-Control: no-store; a missing or foreign report, or an absent or unreadable screenshot, returns 404"
      - "DELETE /api/me/feedback/{id} returns 204 for the caller's report older than 24 hours, 409 for one inside the window, and 404 for a missing or foreign report"
      - "All three routes work without current privacy consent"
    notes: "Pinned by backend/tests/test_users_router.py::TestListMyFeedback, TestViewMyScreenshot and TestDeleteMyFeedback. The routes depend on get_current_user rather than require_consent, like the data export, because access and erasure do not depend on consent (users.py). The 24-hour window is FEEDBACK_CAP_WINDOW from backend/routers/feedback.py, shared with the submission cap."

  # ── Security (cross-cutting) ────────────────────────────────────────────

  - id: FD-044
    title: CSRF origin check on state-changing requests
    statement: "When a non-GET/HEAD/OPTIONS request arrives, the system shall accept it only if it carries X-Requested-With: XMLHttpRequest or an Origin (or Referer) whose scheme+host is in the CORS allowlist; requests with an unknown origin, or with none of these headers, are rejected with 403. POST /api/csp-report is exempt: browsers send CSP violation reports without X-Requested-With, and the endpoint is unauthenticated and changes no state, so it is outside the CSRF threat model."
    category: non-functional
    priority: must
    status: active
    source: "PR #507 (SEC-005); CSP-report exemption PR #834"
    acceptance:
      - "A POST with Origin https://evil.example returns 403 'CSRF check failed: unexpected origin'"
      - "A POST with X-Requested-With: XMLHttpRequest passes regardless of Origin"
      - "A POST with neither Origin/Referer nor X-Requested-With returns 403 'CSRF check failed: missing Origin/Referer' and is logged as csrf_no_origin_rejected"
      - "A POST to /api/csp-report with no X-Requested-With and a foreign Origin is accepted (204); the exemption applies to that path only"
    notes: "CORS allow_headers must keep X-Requested-With or the SPA bypass breaks."

  - id: FD-045
    title: Security response headers
    statement: "When any response is served, the system shall attach X-Content-Type-Options: nosniff, X-Frame-Options: DENY, Referrer-Policy, Permissions-Policy, a restrictive CSP (self-only scripts/styles; images from self, image.tmdb.org and data:; connect to self and Sentry; frame-ancestors 'none'), and HSTS whenever secure cookies are in effect."
    category: non-functional
    priority: must
    status: active
    source: "PRs #497 (SEC-016), #501 (SEC-011)"
    acceptance:
      - "All listed headers are present on both API and SPA responses"
      - "HSTS is keyed to settings.cookie_secure, not merely to an https BASE_URL"
      - "Fonts are self-hosted; the CSP contains no Google Fonts origins"

  - id: FD-046
    title: Per-user rate limiting
    statement: "When applying rate limits, the system shall key on the authenticated user id decoded from the session JWT, falling back to client IP for anonymous requests, so users cannot bypass limits by rotating IPs; behind Railway, where the entrypoint trusts all proxies and X-Forwarded-For is therefore client-controlled, anonymous keys shall come from the edge-set X-Real-IP header instead."
    category: non-functional
    priority: must
    status: active
    source: "PR #505 (SEC-007)"
    acceptance:
      - "Two sessions of the same user share one rate-limit bucket"
      - "429 responses use the standard slowapi handler"
      - "On Railway, anonymous keys use a valid X-Real-IP, so a spoofed X-Forwarded-For cannot reset the limit; off Railway, X-Real-IP is ignored"
      - "With RAILWAY_ENVIRONMENT set and FORWARDED_ALLOW_IPS unset, uvicorn runs with --forwarded-allow-ips='*'; elsewhere it defaults to loopback with a warning"
      - "Every route that resolves get_current_user carries a @limiter.limit decorator, GET /api/me included at 60/minute (AUD-26, #708; pinned by test_rate_limiting.py::test_every_authenticated_route_is_rate_limited)"

  - id: FD-047
    title: Startup configuration validation
    statement: "When the application starts, the system shall refuse to boot if DATABASE_URL is missing or the localhost placeholder, if SECRET_KEY (or a set TOKEN_ENC_KEY) is under 32 chars, a known placeholder or built from fewer than 6 distinct characters, or if an OAuth client id is configured without a valid TOKEN_ENC_KEY; CORS_ORIGINS shall never contain '*', and on a detected hosting platform shall contain no localhost or loopback origin (AUD-23, #705)."
    category: constraint
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "Settings() raises for each invalid combination above (see test_config.py)"
      - "Platform env var detected + CORS_ORIGINS unset (localhost default) or naming localhost/*.localhost/127.0.0.0/8/::1/0.0.0.0 → Settings() raises cors_origins_loopback; public origins boot; off-platform the localhost default still boots"
      - "entrypoint.sh fail-fasts on missing values and SECRET_KEY length before Python starts, printing lengths but never values"
      - "A key such as 'a' * 32 or 'ab' * 20 is rejected (distinct characters < 6, AUD-28 #710); secrets.token_hex(32)/token_urlsafe(32) output is accepted"
      - "Settings validation errors never echo the rejected value (hide_input_in_errors)"

  - id: FD-048
    title: Cookie Secure flag control
    statement: "While SECURE_COOKIES is set, the system shall honor it for the session-cookie Secure flag; otherwise it shall infer from BASE_URL https, and at startup it shall refuse to boot when a TLS-terminating proxy platform is detected, SECURE_COOKIES is unset and BASE_URL is not https; while the Secure flag is on, the session and OAuth state/PKCE cookies shall be issued, read and expired under names prefixed with __Host- so a sibling subdomain cannot overwrite them."
    category: non-functional
    priority: must
    status: active
    source: "PRs #497, #506 (SEC-006); issue #578 (SEC-10); issue #579 (SEC-11)"
    acceptance:
      - "SECURE_COOKIES=true with http:// BASE_URL still issues Secure cookies"
      - "Railway env detected + flag unset + http BASE_URL → Settings() raises cookie_secure_unset (app refuses to start); explicit SECURE_COOKIES=true/false or https BASE_URL boots"
      - "With cookie_secure true, Set-Cookie names are __Host-filmduel_session / __Host-filmduel_oauth_* and every expiry Set-Cookie for them carries Secure"
      - "With cookie_secure true, an unprefixed filmduel_session cookie is ignored (401)"
      - "With cookie_secure false, names are unprefixed and unchanged"

  - id: FD-049
    title: SSRF-safe provider URL construction
    statement: "When building provider API paths from user-derived values (e.g. Trakt usernames), the system shall URL-encode path segments so crafted values cannot alter the request target."
    category: non-functional
    priority: must
    status: active
    source: "PR #510 (SEC-001)"
    acceptance:
      - "A username containing '/' or '..' cannot change the Trakt API path requested"

  - id: FD-062
    title: Smoke-test session key scoped to one user
    statement: "While SMOKE_SESSION_KEY and SMOKE_USER_ID are both configured, the system shall accept a session JWT whose signature fails against SECRET_KEY but verifies against the smoke key only when its sub is SMOKE_USER_ID, rejecting it with 401 for any other subject; the system shall refuse to start if exactly one of the pair is set, if the smoke key equals SECRET_KEY, if the smoke key fails the key-strength rules applied to SECRET_KEY, or if SMOKE_USER_ID is not a UUID."
    category: non-functional
    priority: must
    status: active
    source: "issue #853 (req-gap orphan)"
    acceptance:
      - "A JWT signed with SMOKE_SESSION_KEY whose sub is SMOKE_USER_ID authenticates, in any letter case of the UUID"
      - "A JWT signed with SMOKE_SESSION_KEY whose sub is another user, or not a UUID, is rejected with 401 'Invalid session'"
      - "With the smoke settings unset, a JWT signed with the would-be smoke key is rejected with 401 'Invalid session'"
      - "An expired smoke-key JWT is rejected with 401 'Session expired'; a SECRET_KEY-signed JWT still authenticates any user while the smoke settings are configured"
      - "Settings with only one of SMOKE_SESSION_KEY / SMOKE_USER_ID set fail with 'must be set together'; a smoke key equal to SECRET_KEY fails with 'must differ from SECRET_KEY'; a weak or placeholder smoke key, or a non-UUID SMOKE_USER_ID, fails validation; neither set is accepted and SMOKE_USER_ID is stored lower-cased"
    notes: "Pinned by backend/tests/test_config.py::TestSmokeSessionSettings and backend/tests/test_auth.py::TestSmokeSessionKey; implemented in backend/config.py (SMOKE_SESSION_KEY, SMOKE_USER_ID and their validators) and backend/routers/auth.py::decode_session_jwt / _is_smoke_user. The key exists so the post-deploy duel smoke test (backend/duel_smoke.py, run by .github/workflows/staging-pipeline.yml; #648, #794) can sign a session without CI ever holding SECRET_KEY. The smoke key is tried only after a SECRET_KEY signature failure, and a smoke-key JWT then passes through the same issuer, audience, expiry, revocation and 30-day-cap checks as any session; a sliding refresh re-issues the cookie signed with SECRET_KEY, as for any session. Issue #853 suggested placing this beside deployment requirements; it sits here because it widens what the session check accepts."

  - id: FD-065
    title: Request-body size ceiling enforced before authentication
    statement: "When a request other than GET, HEAD or OPTIONS carries a body larger than 64 KiB (6 MiB under /api/feedback and its sub-paths), the system shall reject it with 413 before any authentication check runs, whether the oversize is declared via Content-Length or discovered while streaming the body."
    category: non-functional
    priority: must
    status: active
    source: "PR #776 (SEC-03); issue #856 (req-gap orphan)"
    acceptance:
      - "A POST to /api/duels with no session cookie and a JSON body whose Content-Length exceeds 64 KiB returns 413, not the route's 401"
      - "A multipart POST to /api/feedback whose body exceeds 6 MiB returns 413 with no session cookie"
      - "A chunked POST to /api/duels whose streamed body crosses 64 KiB is cut off with 413"
      - "A body under the limit reaches the route, which rejects the unauthenticated request with 401 as before"
      - "GET requests are never limited; /api/feedback/<id> takes the feedback limit and /api/feedbackx the default"
    notes: "Pinned by backend/tests/test_body_limit.py (test_middleware_is_registered, test_limit_for_prefers_longest_prefix, test_oversized_json_is_rejected_before_auth, test_oversized_multipart_is_rejected_before_auth, test_chunked_body_is_cut_off_at_limit, test_small_body_passes_through_to_auth, test_get_is_never_limited). Implemented in backend/middleware/body_limit.py (BodyLimitMiddleware, DEFAULT_MAX_BODY_BYTES, FEEDBACK_MAX_BODY_BYTES, PATH_LIMITS); a non-integer Content-Length is rejected with 400. It runs before authentication because FastAPI reads the body before resolving get_current_user, and neither uvicorn/h11 nor Starlette caps body size, so without it an anonymous client could spool an unbounded upload. It must stay the innermost middleware (added first in backend/main.py): the BaseHTTPMiddleware-based csrf_origin_check and add_security_headers wrap receive() in a task group, which would turn the streamed-cutoff HTTPException into an ExceptionGroup instead of a 413. Because the CSRF check (FD-044) wraps it, a request failing that check gets 403 before its size is examined. The 6 MiB feedback ceiling is transport-level headroom over FD-042's 5 MB screenshot limit, which the route enforces itself."

  - id: FD-066
    title: CSP violation reporting endpoint
    statement: "When a browser posts a CSP violation report to POST /api/csp-report, in either the legacy report-uri format or the Reporting API format, the system shall accept it without requiring a session or CSRF headers, log at most 10 violations per request with the blocked URL reduced to its origin and the document URL to its path, and respond 204, including for non-JSON, non-UTF-8 or unrecognised bodies."
    category: non-functional
    priority: should
    status: active
    source: "PR #834 (SEC-27, #799); issue #857 (req-gap orphan)"
    acceptance:
      - "A legacy application/csp-report body posted with a foreign Origin and no X-Requested-With returns 204 and logs the effective directive, the blocked URL's origin and the document URL's path, with no query string"
      - "An application/reports+json body logs only its csp-violation entries, ignoring other report types"
      - "A keyword blocked-uri such as 'inline' is logged verbatim"
      - "A body carrying 50 violations logs exactly 10"
      - "A non-JSON, non-UTF-8 or unrecognised body returns 204 and logs nothing; an unparseable URL is logged as an empty string"
      - "Every CSP header carries report-uri /api/csp-report and report-to csp-endpoint, and every response carries Reporting-Endpoints: csp-endpoint=\"/api/csp-report\""
    notes: "Pinned by backend/tests/test_csp_report.py (test_legacy_report_is_logged_without_query_strings, test_reporting_api_report_is_logged, test_inline_violation_keeps_keyword, test_logs_at_most_ten_reports_per_request, test_malformed_body_is_accepted_silently, test_unparseable_url_is_logged_empty, test_csrf_exemption_is_limited_to_the_report_path) and backend/tests/test_security_headers.py (test_csp_reports_violations, test_reporting_endpoints_names_csp_endpoint). Implemented in backend/routers/csp_report.py (CSP_REPORT_PATH, _MAX_REPORTS, _scrub_blocked, _scrub_document); the CSRF exemption is in backend/main.py::csrf_origin_check (FD-044) and the report-uri/report-to/Reporting-Endpoints wiring in backend/main.py::add_security_headers (FD-045). Document URLs are cut to their path because query strings can carry OAuth code/state and pair tokens; each logged field is also truncated to 200 characters. The handler reads the raw body rather than declaring a model because browsers never send application/json, and answers 204 to non-JSON, non-UTF-8 or unrecognised bodies so probers learn nothing. The 204 is the handler's own response, and it catches only ValueError from request.json(): JSON nested deeply enough to exhaust the parser raises RecursionError and returns 500. The endpoint is rate-limited to 30/minute (429 beyond, FD-046's limiter), and the pre-auth body ceiling (FD-065) still applies."

  - id: FD-067
    title: LLM concurrency and timeout guard
    statement: "While LLM_MAX_CONCURRENT LLM calls are already in flight in the server process, the system shall fail any further LLM call immediately instead of queueing it, and GET /api/suggestions, POST /api/suggestions/regenerate, POST /api/tournaments (ai_curated) and POST /api/tournaments/{id}/regenerate shall answer it with 503 and Retry-After: 15; each LLM call shall be bounded by LLM_TIMEOUT_SECONDS (at most 120) with no retry; and the application shall refuse to start if LLM_MAX_CONCURRENT is at or above the DB pool capacity (DB_POOL_SIZE + DB_MAX_OVERFLOW)."
    category: non-functional
    priority: must
    status: active
    source: "PR #740 (AUD-01); issue #858 (req-gap orphan)"
    acceptance:
      - "With LLM_MAX_CONCURRENT=1 and one call in flight, a second chat_completion raises LLMBusyError without waiting for the first to finish"
      - "Every LLM request is made with timeout=LLM_TIMEOUT_SECONDS and num_retries=0"
      - "An LLMBusyError during GET /api/suggestions, POST /api/suggestions/regenerate or an AI-curated POST /api/tournaments returns 503 with Retry-After: 15"
      - "A busy 503 does not start the suggestions empty-reply cooldown: a following GET calls the LLM again"
      - "Tournament curation re-raises LLMBusyError unwrapped, so it is not reported as a 500 curation failure"
      - "Settings with LLM_MAX_CONCURRENT equal to DB_POOL_SIZE + DB_MAX_OVERFLOW fail validation with 'below the DB pool capacity'; one below is accepted, the default (2) is below it, and shrinking the pool tightens the bound"
    notes: "Pinned by backend/tests/test_llm_service.py (test_chat_completion_passes_timeout, test_chat_completion_fails_fast_when_slots_full), backend/tests/test_config.py::TestLlmConcurrencyBound, backend/tests/test_suggestions_router.py (test_get_suggestions_503_when_llm_busy, test_busy_llm_does_not_start_cooldown, test_regenerate_returns_503_when_llm_busy), backend/tests/test_tournaments_router.py::test_create_tournament_returns_503_when_llm_busy and backend/tests/test_curator.py::TestCurateTournamentLlmBusy. Implemented in backend/services/llm.py (LLMBusyError, the _slots() semaphore checked with locked() before entering, and the acompletion call's timeout/num_retries=0), backend/config.py (LLM_TIMEOUT_SECONDS, LLM_MAX_CONCURRENT >= 1, llm_slots_below_pool_capacity), backend/services/curator.py (re-raises LLMBusyError), and the LLMBusyError handlers in backend/routers/suggestions.py and backend/routers/tournaments.py. The guard exists because each in-flight LLM call pins the calling request's pooled DB connection: queueing on the semaphore or retrying would hold that connection longer, and a cap at pool capacity could starve every other request. The semaphore is per process, not cluster-wide; it bounds the deployment only because entrypoint.sh runs a single uvicorn worker. The pool bound is checked when Settings is first built, which backend/db.py and backend/main.py do at import, so a bad cap fails the app import. The busy check runs after the LLM_API_KEY check, so an unconfigured key still answers FD-035's 503 'AI features are not available'. A call that hits LLM_TIMEOUT_SECONDS is an ordinary LLM failure, not a busy one: suggestions answer 500 and tournament curation 500 'AI curation failed' (FD-041). Only the tournament-create 503 is pinned by a router test; the regenerate handler is the same mapping."

  - id: FD-068
    title: Token encryption-key rotation and per-purpose keys
    statement: "The system shall derive a distinct encryption key from TOKEN_ENC_KEY for each secret purpose (OAuth token, feedback screenshot, pair token) and encrypt only under TOKEN_ENC_KEY; it shall decrypt a stored secret with the current key first and, on failure, each key listed in TOKEN_ENC_KEY_PREVIOUS in turn; an OAuth token read under a previous key shall be re-encrypted under the current key when its session commits, unless the row's ciphertext has changed since the read; and an OAuth token that no configured key decrypts shall read as not connected rather than raising an error."
    category: non-functional
    priority: must
    status: active
    source: "PR #812 (per-purpose keys); PR #841 (TOKEN_ENC_KEY_PREVIOUS rotation); issue #859 (req-gap orphan)"
    acceptance:
      - "A value encrypted for one TokenPurpose does not decrypt as another"
      - "A value encrypted under a TOKEN_ENC_KEY_PREVIOUS key decrypts and is returned re-encrypted under TOKEN_ENC_KEY; a value already under the current key is not re-encrypted"
      - "New values are never encrypted under a TOKEN_ENC_KEY_PREVIOUS key"
      - "A value no configured key decrypts raises TokenDecryptError from token_crypto"
      - "Reading a User OAuth token minted under a previous key stores it under the current key when the session commits, and never overwrites a token another transaction committed since the read"
      - "Reading a User OAuth token no configured key decrypts returns \"\", logs oauth_token_undecryptable without the ciphertext, and leaves the stored ciphertext unchanged"
      - "python -m backend.scripts.reencrypt_tokens rewrites every OAuth token and screenshot still under a previous key, is idempotent, leaves unreadable values as stored and counts them, and does not overwrite a value stored since its read"
    notes: "Pinned by backend/tests/test_token_crypto.py (test_purposes_do_not_decrypt_each_other, test_previous_key_decrypts_and_rotates_to_current, test_current_key_value_is_not_rotated, test_previous_key_never_encrypts, test_unknown_key_raises, TestEncryptedTokenRotation), backend/tests/test_reencrypt_tokens.py and backend/tests/test_migration_028_rekey_per_purpose.py. Implemented in backend/services/token_crypto.py (TokenPurpose, _derive, _previous_fernets, _decrypt, decrypt_and_rotate), backend/db_models.py (EncryptedToken.__get__ and the before_commit listener _persist_token_rotations), backend/config.py (TOKEN_ENC_KEY_PREVIOUS, comma-separated) and backend/scripts/reencrypt_tokens.py; the operator procedure is 'Rotating TOKEN_ENC_KEY' in docs/PRD.md. Extends FD-006, which covers single-key encryption at rest. Re-encrypt on commit applies only to OAuth tokens read through the User model: feedback screenshots under a previous key still decrypt but are moved to the current key only by the re-encrypt script, and pair tokens are never stored. The not-connected fallback is likewise OAuth-only: an undecryptable screenshot is still listed with has_screenshot true and is answered 404 'Screenshot not found' by the admin and owner screenshot views (backend/routers/feedback.py::_safe_decrypt), and an undecryptable pair token is rejected with 400 by POST /api/duels (FD-025) and ignored as an anti-repeat hint by GET /api/movies/pair. The undecryptable OAuth ciphertext is kept so a key missing from TOKEN_ENC_KEY_PREVIOUS can be added back to recover it. The rewrite on commit runs as an UPDATE guarded by WHERE column = the ciphertext read, not as an attribute write, so it cannot clobber a concurrently refreshed token. Migration 028 moved values from the former shared HKDF context (fernet-key-v2) onto the per-purpose keys, nulling any value neither key decrypted."

  - id: FD-070
    title: Verified database TLS on hosting platforms
    statement: "When a hosting platform is detected at startup, the system shall connect to Postgres (for both the application and Alembic migrations) with TLS verified against the bundled Supabase root CA, and shall never fall back to an unverified or cleartext connection on that path."
    category: non-functional
    priority: must
    status: active
    source: "PR #713 (AUD-04, #686); issue #861 (req-gap orphan)"
    acceptance:
      - "With any of RAILWAY_ENVIRONMENT, RENDER, FLY_APP_NAME, HEROKU_APP_NAME or K_SERVICE set, database_connect_args() carries an ssl.SSLContext with CERT_REQUIRED, check_hostname enabled and the Supabase Root 2021 CA as its only trusted CA"
      - "With no platform env var set, database_connect_args() sets no ssl override, so a local Postgres without TLS still connects"
      - "The bundled root CA's SHA-256 fingerprint is 807025ad50d4ed219d2c9c7d299c004f824eb00cf7f65afef607d07b72e6cafa"
      - "The app engine and the Alembic migration engine both take their connect_args from database_connect_args()"
    notes: "Pinned by backend/tests/test_config.py::TestDatabaseConnectArgs (test_no_tls_override_off_platform, test_verified_tls_on_each_known_platform, test_strict_x509_disabled_for_supabase_chain, test_pinned_ca_fingerprint) and backend/tests/test_db.py (test_app_engine_uses_shared_connect_args, test_migration_engine_uses_shared_connect_args). Implemented in backend/config.py (_PROXY_PLATFORM_ENV_VARS, _SUPABASE_ROOT_CA = backend/certs/supabase-root-2021-ca.crt, detected_proxy_platform, database_connect_args), used by backend/db.py and backend/migrations/env.py::run_async_migrations. Passing an SSLContext makes asyncpg require TLS rather than treat it as advisory, which closes the default sslmode=prefer fallback to cleartext as well as server impersonation. The context relaxes only VERIFY_X509_STRICT, because Supabase's intermediate CA has no keyUsage extension, which Python 3.13+ rejects under strict mode. Platform detection is the same env-var list that drives FD-048's Secure-cookie check and FD-047's localhost-CORS refusal; an env var set to an empty string does not count. Off-platform the connection keeps asyncpg's default. Offline migrations (alembic --sql) only emit SQL and open no connection."

  - id: FD-071
    title: CORS origin shape and https enforcement at startup
    statement: "When the application starts, the system shall reject any CORS_ORIGINS entry that is not a bare scheme://host[:port] (including entries with embedded userinfo, without echoing the credentials in error output), and shall reject any entry that is not https when a hosting platform is detected."
    category: constraint
    priority: must
    status: active
    source: "PR #831 (SEC-25, #797); issue #862 (req-gap orphan)"
    acceptance:
      - "A CORS_ORIGINS entry with a trailing slash, path, query, fragment, userinfo, no scheme or no host makes Settings() raise naming scheme://host[:port], on or off a hosting platform"
      - "A rejected entry carrying userinfo appears in the error with everything between the scheme and its last '@' replaced by ***, so no part of the credential is printed"
      - "With any of RAILWAY_ENVIRONMENT, RENDER, FLY_APP_NAME, HEROKU_APP_NAME or K_SERVICE set, a plain-http CORS_ORIGINS entry makes Settings() raise cors_origins_insecure naming the detected env var; off-platform the same entry boots"
    notes: "Pinned by backend/tests/test_config.py::TestCorsOriginsValidation (test_non_bare_origin_rejected, test_rejected_userinfo_not_echoed) and TestCorsLoopbackFailClosed (test_plain_http_public_origin_raises_on_each_platform, test_plain_http_public_origin_allowed_off_platform, test_localhost_default_allowed_off_platform). Implemented in backend/config.py (_is_bare_origin, _redact_userinfo, Settings.validate_cors_origins, Settings.require_https_cors_origins_on_proxy_platform). Extends FD-047, which covers the '*' and loopback-on-platform refusals of the same list. The CSRF origin check trusts every CORS_ORIGINS entry, and a browser's Origin header is always exactly scheme://host[:port], so a non-bare entry can never match a real request and only hides a misconfiguration. Platform detection is the same env-var list that drives FD-047's loopback refusal, FD-048's Secure-cookie check and FD-070's database TLS; an env var set to an empty string does not count. Off-platform the localhost http defaults still boot."

  # ── Deployment & platform constraints ───────────────────────────────────

  - id: FD-050
    title: Single-service SPA hosting
    statement: "While deployed, the system shall serve the built React SPA from the same FastAPI service: /assets from the Vite build, and a wildcard route returning index.html for any non-API path, rejecting path-traversal attempts and returning 503 when the build is absent; interactive API docs shall be disabled outside localhost."
    category: constraint
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "GET /rankings (no such API route) returns index.html with 200"
      - "A request resolving outside the static dir is logged and served index.html instead of the file"
      - "/docs, /redoc and /openapi.json return 404 when BASE_URL is not localhost"

  - id: FD-051
    title: Railway deployment with zero-downtime migrations
    statement: "When the production container starts, the system shall validate required env vars, verify the Python import, start uvicorn first so /health passes during startup, then run Alembic migrations with exponential-backoff retries (up to ~20 min), aborting the container if migrations ultimately fail."
    category: constraint
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "GET /health returns {status:'ok'} (limit 1000/minute) and is Railway's healthcheckPath"
      - "entrypoint.sh waits up to 60s for /health before running alembic upgrade head"
      - "Deploys go through PRs to main; Railway auto-deploys on merge (branch protection)"
    notes: "Docker image is python:3.14-slim, matching ci.yml python-version and the --python-version of the hash-locked requirements; Dependabot ignores major/minor base-image bumps so the three move together (#574)."

  - id: FD-052
    title: Database constraint - pooled Postgres via SQLAlchemy
    statement: "While connecting to Supabase Postgres through the Supabase session pooler (port 5432) as the filmduel role, the system shall use SQLAlchemy 2.0 async with asyncpg and statement_cache_size=0, never the supabase-py SDK, with schema changes applied exclusively through Alembic migrations."
    category: constraint
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "Engine construction sets statement_cache_size=0"
      - "No supabase-py dependency exists in backend/requirements.in"
      - "Every schema change ships as an Alembic revision (backend/migrations)"
    notes: "The filmduel role's search_path is (filmduel, extensions), so unqualified table names resolve to the filmduel schema without startup search_path parameters. statement_cache_size=0 is kept so the engine also works behind the transaction pooler (port 6543)."

  # ── Cross-provider catalog integrity ────────────────────────────────────

  - id: FD-053
    title: Cross-provider catalog dedup by IMDB id during SIMKL ingestion
    statement: "When ingesting titles from SIMKL, the system shall match each incoming title against existing catalog rows by IMDB id within the same media_type and, on a match, reuse that row — backfilling its simkl_id rather than inserting a second row — so a user who connects SIMKL after Trakt keeps one catalog entry per title; unmatched SIMKL titles are inserted with the SIMKL id stored in both the trakt_id and simkl_id columns."
    category: functional
    priority: must
    status: active
    source: "issue #537 (req-gap orphan)"
    acceptance:
      - "Ingesting a SIMKL title whose imdb_id matches an existing movies row issues no INSERT into movies — only an UPDATE setting simkl_id on the matched row"
      - "The user_movies row written for a matched title references the pre-existing movie id, so per-user seen/elo/battle state stays on one row"
      - "A SIMKL title with no imdb match is inserted with trakt_id == simkl_id == the SIMKL id"
    notes: "Suspected gap not canonized: the dedup is one-directional. _upsert_pool (the Trakt path) never reads imdb_id and there is no unique index on movies.imdb_id — only uq_movies_trakt_id_media_type — so a user who connects SIMKL first and Trakt second still gets a second catalog row for the same title. The guarantee above holds for the SIMKL-after-Trakt ordering only."

  # ── Consent disclosure parity ───────────────────────────────────────────

  - id: FD-054
    title: Public privacy policy and itemized AI data disclosure
    statement: "The system shall publish the current privacy policy at /privacy, reachable without a session and without having accepted the policy, and the consent prompt shall itemize the categories of data shared with third-party AI processors."
    category: functional
    priority: must
    status: active
    source: "issue #536 (req-gap orphan)"
    acceptance:
      - "/privacy renders the policy with no session cookie and for a user who has not accepted the current policy version — it is outside the auth and consent gates, not merely permitted by them"
      - "The login footer and the settings sidebar both link to /privacy"
      - "The policy names every service that receives personal data — the sign-in providers (Trakt, SIMKL), hosting (Railway, Supabase), error tracking (Sentry) and the AI gateway — and discloses IP processing for rate limits, feedback reports and screenshots, administrator access, and the opt-in Trakt rating and watchlist write-back (AUD-17, #699; pinned by PrivacyPolicy.test.jsx)"
      - "The consent prompt names, per AI feature, the film fields sent to the gateway (title, year, genres, preference tier, community rating, duel count), the candidate-pool cap, and the vendor, and states that raw ELO scores and account identifiers are never transmitted"
      - "The suggestion and curation prompts substitute preference tiers for raw ELO and carry no account identifier"
    notes: "The third and fourth criteria are enforced as a pair — backend/tests/test_llm_disclosure.py pins the service-side literals (CANDIDATE_LIMIT, the top-10/bottom-5 slices, elo_tier substitution, LLM_BASE_URL's vendor host) and ConsentModal.test.jsx pins the same values in the modal copy, so widening one side without the other fails. Two limits are not guaranteed: LLM_BASE_URL is env-overridable, so a deployment pointed at another gateway makes the named vendor inaccurate without failing a test; and curate_tournament never receives a user id, so the no-account-identifier clause holds structurally there rather than by assertion. Each prompt also carries a film reference the itemized list does not name — trakt_id for suggestions, the catalog row id for curation — so the model can identify its picks; these reference films, not users."

  # ── Feedback screenshot redaction ───────────────────────────────────────

  - id: FD-055
    title: Client-side screenshot annotation and redaction for feedback reports
    statement: "When a user opens the screenshot editor on a feedback attachment, the system shall offer redact, highlight, arrow and text tools with undo, and on save shall flatten the original image, every committed annotation and any in-progress text onto a single canvas exported as one JPEG (quality 0.85) that replaces the attachment, so an edited screenshot reaches POST /api/feedback (FD-042) as the flattened image only and never as the pre-redaction original."
    category: functional
    priority: must
    status: active
    source: "issue #535 (req-gap orphan)"
    acceptance:
      - "The editor exposes redact, highlight, arrow and text tools and an undo that drops the most recent annotation from the export"
      - "Saving draws the original image and then every committed annotation onto one canvas and exports it via canvas.toDataURL('image/jpeg', 0.85); a redaction is an opaque black fillRect painted over the original pixels, not a separate overlay layer"
      - "onSave receives only that flattened data URL — the editor hands back no copy of, or reference to, the pre-annotation image"
      - "A screenshot edited before submission is submitted as the flattened data URL: submitFeedback receives the editor's output, not the data URL read from the file"
    notes: "Suspected gap not canonized: the editor is opt-in. ReportIssueModal's handleSubmit computes the payload as editedScreenshotDataUrl || screenshotDataUrl and 'Edit Screenshot' is a button the user may never press, so a raw, un-annotated screenshot is a reachable submission; the guarantee above holds for the edited path only, and issue #535's stronger 'the unredacted original never leaves the browser' wording is not adopted, per this file's rule that statements describe today's behavior. Only redact is destructive (opaque black); highlight, arrow and text are additive marks over intact pixels. The original also stays in client memory after a save — handleEditorSave sets editedScreenshotDataUrl without clearing screenshotDataUrl — so re-opening the editor passes the original rather than the previous flattened export: a user who saves redaction A, re-opens to add redaction B and saves again ships an export in which A's pixels are visible again. The flatten mechanism is intact in that case; the earlier redaction is simply not carried forward. Neither path is tested, for the same reason as the opt-in path."

  # ── Tournament browsing ─────────────────────────────────────────────────

  - id: FD-056
    title: Tournament list and bracket detail scoped to the requesting user
    statement: "When a user requests GET /api/tournaments, the system shall return their own tournaments newest-first, capped at 100 rows and unpaginated, each carrying a progress string of \"Completed\", \"Abandoned\", or the current round's played/total match count; and when they request GET /api/tournaments/{id}, the system shall return the full bracket with matches ordered by (round, position), loading the tournament by id and owner together so another user's tournament id yields 404 rather than a foreign bracket."
    category: functional
    priority: must
    status: active
    source: "issue #534 (req-gap orphan)"
    acceptance:
      - "The list query filters on the requesting user's id, orders by created_at DESC and binds a LIMIT of 100 — scoping and ordering are in the SQL, not applied to an already-fetched set — and the response preserves that row order"
      - "A completed tournament lists as \"Completed\", an abandoned one as \"Abandoned\", and an active one as \"Round N — P/T matches played\""
      - "GET /api/tournaments/{id} returns matches sorted by round then position regardless of the order the rows arrive in"
      - "GET /api/tournaments/{id} for a tournament owned by another user returns 404 \"Tournament not found\""
    notes: "The 100-row cap has no pagination and no total count, so a user past 100 tournaments cannot reach the oldest ones through the API at all; issue #534 explicitly defers the pagination decision, so the cap is canonized as today's behavior rather than as an intended limit. The (round, position) ordering lives in _tournament_schema, not in SQL, so it holds for every endpoint returning the full tournament schema — create, regenerate and submit-result as well as this one — which is broader than the bracket-detail wording above. _active_progress falls through to a degenerate \"Round N — 0/0 matches played\" for an active tournament with no matches or with every match already played (tournaments.py:117-119); that is reachable only for a tournament whose status was not advanced to completed, and is pinned by existing tests rather than treated as a defect here."

  # ── Profile response contract ───────────────────────────────────────────

  - id: FD-057
    title: Profile response excludes OAuth tokens and token expiries
    statement: "When an authenticated user requests GET /api/me, the system shall return their profile as exactly ten fields — id, both provider usernames, creation date, the three preference toggles, the two privacy-consent fields and the pool import status — assembled field-by-field into a fixed response schema, so that the OAuth access tokens, refresh tokens and token expiries carried on the user row are absent from the response by construction rather than by removal."
    category: functional
    priority: must
    status: active
    source: "issue #532 (req-gap orphan)"
    acceptance:
      - "GET /api/me for a user row carrying Trakt and SIMKL access tokens, refresh tokens and token expiries returns a body whose key set is exactly id, trakt_username, simkl_username, created_at, sync_ratings_to_trakt, sync_ratings_to_simkl, use_ai_features, privacy_policy_accepted, privacy_policy_version, pool_import_status"
      - "No access-token, refresh-token or expiry value held on the user row appears anywhere in the response body, under any key"
    notes: "Pinned by backend/tests/test_users_router.py::TestProfileResponseContract, which asserts the body's key set as an allow-list — set equality against the whole ten-field set, so a field added to UserResponse fails — rather than as a deny-list naming only today's token fields; a companion test asserts no sentinel token or expiry value appears in the body under any key, since set equality alone would accept a secret re-keyed into an allow-listed field. The guarantee is structural: _build_user_response (users.py:57-69) names each field it copies and UserResponse (schemas.py:13-23) declares no token field, so neither the ORM row nor any dict of it is passed through. It is also broader than the GET /api/me wording above — _build_user_response is the single builder for PATCH /api/me/settings and POST /api/me/consent as well, so all three responses share the ten-field shape; only GET /api/me is pinned by test. Issue #532's stronger claim that tokens never appear in *any* user-facing response is not canonized, per this file's rule that statements describe verified behavior: it holds across backend/schemas.py today (the only fields matching /token/ there are the duel pair tokens next_pair_token and pair_token, which are opaque pagination cursors, not OAuth credentials), but no test constrains response schemas outside this one."

  # ── TMDB credential transport ───────────────────────────────────────────

  - id: FD-058
    title: TMDB credential never sent in the request URL
    statement: "When calling the TMDB API with a v4 API Read Access Token configured in TMDB_API_KEY, the system shall send it only as an Authorization: Bearer header; when a v3 API Key is configured it shall be sent as the api_key query parameter (TMDB's only form for that credential) and the system shall log a tmdb_v3_api_key warning at startup, never including the value."
    category: non-functional
    priority: should
    status: active
    source: "issue #580 (SEC-019)"
    acceptance:
      - "With a JWT-shaped (eyJ…, two dots) TMDB_API_KEY, requests to api.themoviedb.org carry Authorization: Bearer and an empty query string (test_tmdb_client.py)"
      - "With a 32-hex TMDB_API_KEY, requests carry ?api_key= and lifespan() logs a WARNING containing tmdb_v3_api_key but not the key value (test_config.py)"
    notes: "The credential's shape selects the transport (backend/services/tmdb.py::is_read_access_token) so the single TMDB_API_KEY setting needs no rename; closing the leak in a deployment is an operator action — replacing the value with the Read Access Token — not a code change. Dropping the v3 query-parameter path is deferred until production has migrated."

  # ── Initial pool import ─────────────────────────────────────────────────

  - id: FD-060
    title: Consent-deferred initial pool import with status and retry
    statement: "When a user first accepts the privacy policy via POST /api/me/consent, the system shall start the provider pool import as a background task and report its progress as pool_import_status (importing, then complete, or failed when a provider fetch fails after retries or the import raises), reporting an import still importing after 20 minutes as failed; POST /api/me/pool-import shall restart a non-running import, rate-limited at 3/hour, and return the current status unchanged while an import is running; and while the status is importing the SPA shall show a full-screen import screen in place of the page, polling GET /api/me until it leaves importing, and when it is failed shall offer Retry import and a Continue anyway exit that dismisses the screen without the import completing."
    category: functional
    priority: must
    status: active
    source: "issue #851 (req-gap orphan)"
    acceptance:
      - "The first consent sets pool_import_status to importing with a start timestamp and queues _run_pool_import and the poster backfill; re-accepting after a policy version bump queues nothing"
      - "_run_pool_import records complete when every provider fetch succeeds and failed when one fails or the sync raises, and only on the row whose pool_import_started_at still matches its run"
      - "GET /api/me reports an importing status started more than 20 minutes ago as failed"
      - "POST /api/me/pool-import restarts a failed import (status importing, new start timestamp, job queued) and leaves a running import untouched with no commit"
      - "On load with pool_import_status importing or failed the SPA renders the import screen instead of the route; on failed it offers Retry import and Continue anyway, and Continue anyway calls onDone"
    notes: "Pinned by backend/tests/test_auth.py::test_first_consent_queues_background_import_and_backfill and test_reconsent_does_not_resync, backend/tests/test_consent.py::test_accept_consent_idempotent, backend/tests/test_users_router.py::TestRunPoolImport, TestRecordPoolImportOutcome, TestEffectivePoolImportStatus and TestRetryPoolImport, frontend/src/__tests__/PoolImportScreen.test.jsx and the import-screen cases in frontend/src/__tests__/App.test.jsx. The import moved from the OAuth callback to first consent so no provider data is ingested before consent is recorded (#571); FD-013's login-triggered wording predates that and is tracked by issue #627. The 20-minute POOL_IMPORT_STALE_AFTER (users.py) must exceed the worst case of every provider fetch exhausting its retries (~13 minutes) and is computed on read: the stored status stays importing. A retry restamps pool_import_started_at so a superseded run's outcome matches no row. The retry route depends on require_consent, unlike the consent route. Issue #851's 'holds the user on an import screen until it completes' wording is not adopted: the hold is unconditional only while importing, and Continue anyway leaves on failed. Continue anyway only clears ProtectedRoute's local state; the stored status stays failed, so the screen returns the next time ProtectedRoute reads GET /api/me."

  # ── Trakt account identity ──────────────────────────────────────────────

  - id: FD-061
    title: Trakt identity keyed on the immutable account uuid
    statement: "When the Trakt OAuth callback resolves a user, the system shall identify the account by Trakt's immutable uuid, never by its renamable slug; when no row carries that uuid, a legacy row holding the slug and no uuid shall be adopted only when that row's own stored Trakt token proves the same uuid, and never when it is an admin row; and any other row still holding the slug shall have it cleared."
    category: non-functional
    priority: must
    status: active
    source: "issue #852 (req-gap orphan)"
    acceptance:
      - "A returning user whose Trakt slug changed is found by trakt_uuid, keeps their row and session, and has trakt_user_id updated to the new slug"
      - "A row with trakt_uuid NULL and the matching slug is adopted (trakt_uuid set, no new row) when its stored token proves the authenticating uuid; when it does not, a new account is created and the refused row keeps trakt_uuid NULL but has its trakt_user_id cleared in the same login"
      - "_legacy_row_belongs_to refuses an admin row without calling Trakt, and accepts a row only when the profile its stored token reads carries the authenticating uuid"
      - "A newcomer holding a slug last held by a uuid-bound row gets a new account, and the slug is cleared from the old row"
      - "A Trakt profile response without ids.uuid fails the callback with 502 before any user lookup"
    notes: "Pinned by backend/tests/test_auth.py::test_returning_user_matched_by_uuid_gets_new_slug, test_legacy_row_without_uuid_is_adopted_once, test_legacy_row_is_not_adopted_when_uuid_does_not_match, test_legacy_admin_row_is_never_adopted, test_legacy_row_belongs_to_compares_profile_uuid, test_new_holder_of_freed_slug_gets_a_new_account and test_profile_without_uuid_raises_502_and_redacts_pii. This is the slug-reuse account-takeover fix (#684, SEC-01): slugs are reusable, so a slug match alone never transfers a row. Issue #852's 'its token proves the same uuid' is made precise here: the proof uses the legacy row's stored access token (backend/routers/auth.py::_legacy_row_belongs_to), with one refresh attempted if Trakt rejects it — not the token from the login in progress, which proves only the new holder's uuid. The slug stays on the row as trakt_user_id because Trakt API calls need it; the release of a stale slug happens during the login that claims it. A uuid-bound row recovers its current slug at its owner's next login, because it is found by trakt_uuid; a refused legacy row is left with neither trakt_uuid nor trakt_user_id, so no later login reaches it — including its rightful owner's, when the stored token can no longer be read and its one refresh fails. SIMKL identity needs no equivalent: its numeric id is the only key and has no slug (slug_column=None)."
