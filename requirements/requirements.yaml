      - "limit is capped at 200; an invalid decade string returns 400"
      - "Rank numbers account for pagination offset"

  - id: FD-032
    title: Aggregate stats
    statement: "When a user requests GET /api/rankings/stats, the system shall return total duels, total ranked count, unseen count, average ELO, and highest/lowest rated films for the selected media_type."
    category: functional
    priority: should
    status: active
    source: back-ported
    acceptance:
      - "With no ranked films, highest_rated/lowest_rated are omitted and counts are zero"

  - id: FD-033
    title: Letterboxd-compatible CSV export
    statement: "When a user requests GET /api/rankings/export/csv, the system shall stream a CSV with header Position,Title,Year,imdbID,Rating10 of ranked films in ELO order, sanitizing cells by prefixing a single quote wherever formula characters (=+-@ tab newline) begin the cell or follow a semicolon or line break (optionally behind double quotes), capped at 10000 rows and rate-limited to 10 exports/hour."
    category: functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "Response has Content-Disposition attachment; filename=filmduel_rankings.csv"
      - "A title beginning with '=' is emitted as \"'=...\" (CSV formula-injection guard)"
      - "A title containing ';=', ';\"=' or a line break followed by '=' has the quote prefix inserted before the '=', so a semicolon-locale spreadsheet re-splitting the row never starts a field with a formula"
      - "Rating10 equals the get_elo_ratings rating of the film's ELO among the user's ranked ELOs of that media_type"

  # ── TV show support ─────────────────────────────────────────────────────

  - id: FD-034
    title: Media-type scoping (movies vs shows)
    statement: "When any pool, swipe, duel, rankings, suggestions or tournament operation runs, the system shall scope it by media_type ('movie' or 'show', default 'movie'), maintaining independent pools, ELO ladders, next_action counters and rankings per type, with a nav toggle in the frontend."
    category: functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "media_type query values other than 'movie'/'show' are rejected with 422 (Literal type)"
      - "A user's show rankings are unaffected by movie duels and vice versa"

  # ── AI suggestions ──────────────────────────────────────────────────────

  - id: FD-035
    title: AI watchlist suggestions
    statement: "When an eligible user (>=20 ranked films of the media_type, AI consent per FD-009) requests GET /api/suggestions, the system shall treat the newest batch (dismissed rows included) as fresh if generated within 24 hours and return its non-dismissed suggestions, or status 'all_dismissed' if every suggestion in it is dismissed; when no fresh batch exists it shall, if another generation for that user is in progress, return the user's existing non-dismissed suggestions or 429 when there are none, status 'no_candidates' without calling the LLM if an LLM attempt came back with no usable picks within the last hour, and otherwise generate up to 6 new picks by sending an LLM a taste profile plus up to 50 unseen candidates and persisting each pick with its one-line reason."
    category: functional
    priority: should
    status: active
    source: back-ported
    acceptance:
      - "With < 20 ranked films the response is {suggestions: [], status: 'not_enough_films'}"
      - "The LLM may only select from the provided candidate list; malformed ids are skipped, not surfaced"
      - "With no candidates available the status is 'no_candidates'"
      - "A fresh batch whose suggestions are all dismissed returns {suggestions: [], status: 'all_dismissed'} without generating"
      - "Within an hour of an LLM attempt with no usable picks the status is 'no_candidates' and the LLM is not called"
      - "With no fresh batch, a generation already in progress for the user and no existing non-dismissed suggestions the endpoint returns 429"
      - "With no fresh batch, a generation already in progress and existing non-dismissed suggestions the endpoint returns them as 'ready' instead of 429"
      - "With LLM_API_KEY unconfigured the endpoint returns 503"
    notes: "LLM is an OpenAI-compatible gateway (Requesty/OpenRouter via LLM_BASE_URL/LLM_MODEL), not a hardcoded provider — the older spec docs naming a specific Anthropic model are outdated."

  - id: FD-036
    title: Suggestion lifecycle actions
    statement: "When a user acts on a suggestion, the system shall support dismiss (soft-delete via dismissed_at, excluded from future responses), add-to-watchlist (timestamped, optionally pushed to the provider watchlist), and mark-as-seen."
    category: functional
    priority: should
    status: active
    source: back-ported
    acceptance:
      - "POST /api/suggestions/{id}/dismiss on another user's suggestion returns 404"
      - "Dismissed suggestions do not appear in subsequent GET /api/suggestions responses"

  - id: FD-037
    title: Suggestion regeneration cap
    statement: "When a user calls POST /api/suggestions/regenerate, the system shall dismiss current suggestions and generate a fresh set, allowing at most 3 regenerations per rolling 24 hours (enforced both by the rate limiter and a DB count), returning 429 beyond the cap."
    category: functional
    priority: should
    status: active
    source: back-ported
    acceptance:
      - "A 4th regenerate within 24h returns 429"
    notes: "Suspected quota bug not canonized: the DB guard counts distinct generated_at timestamps across ALL suggestion generations (including automatic staleness refreshes and both media types), so an auto-refresh can consume the user's manual regeneration quota. Also, an empty regeneration result reports status 'not_enough_films' where GET reports 'no_candidates'. Spec'd 429 body field next_allowed_at is not implemented."

  - id: FD-038
    title: LLM privacy - preference tiers, not raw scores
    statement: "When building any LLM prompt, the system shall convert raw ELO values to coarse preference tiers (highly preferred / preferred / neutral / less preferred) and shall never transmit raw ELO, and shall redact known prompt-injection phrases from film titles and other DB-sourced strings before inclusion."
    category: non-functional
    priority: must
    status: active
    source: "PRs #504 (SEC-008), #508 (SEC-002), #503 (SEC-009)"
    acceptance:
      - "sanitize_llm_input replaces injection phrases with [REDACTED] and truncates to a max length"
      - "No prompt-construction code path serializes the elo column value"
      - "Raw LLM responses are not echoed into error logs on parse failure"

  # ── Tournaments ─────────────────────────────────────────────────────────

  - id: FD-039
    title: Tournament creation and seeding
    statement: "When a user creates a tournament, the system shall accept bracket sizes of 8/16/32/64 over a filtered pool (optional genre or decade filter, media_type scoped) of ranked films, require at least 4 matching films, reject brackets larger than 4x the pool, seed by ELO (1 vs last), pre-generate all rounds, and auto-resolve first-round byes for top seeds when the pool is smaller than the bracket."
    category: functional
    priority: should
    status: active
    source: back-ported
    acceptance:
      - "POST /api/tournaments with < 4 matching ranked films returns 400"
      - "bracket_size outside {8,16,32,64} is rejected at the schema layer"
      - "Bye matches are created with is_bye=true and winner pre-filled; GET /{id}/next never returns a bye"
      - "Per-user creation is capped at 100 tournaments per 24h (429 beyond)"

  - id: FD-040
    title: Tournament matches are real duels
    statement: "When a tournament match winner is submitted, the system shall process it through the standard duel pipeline (ELO update, duel history row with mode='tournament', optional provider sync), propagate the winner into the next round (auto-resolving any resulting bye), and mark the tournament completed with a champion when the final resolves."
    category: functional
    priority: should
    status: active
    source: back-ported
    acceptance:
      - "Submitting a match result changes both films' main-ladder ELO exactly as a regular duel would"
      - "Each played tournament_matches row stores the linked duel_id"
      - "Completing the final sets status='completed', champion_movie_id and completed_at"
      - "DELETE /api/tournaments/{id} soft-deletes by setting status='abandoned'"

  - id: FD-041
    title: AI-curated tournaments
    statement: "When a user creates a tournament with ai_curated=true (AI consent per FD-009), the system shall send the ELO-capped candidate list (top bracket_size*3, as preference tiers) to the LLM to select exactly bracket_size films and produce a name, tagline and theme description, seed the selected films by ELO (the LLM never controls matchups), store the raw LLM response on the tournament row, and support regeneration with the same candidate pool."
    category: functional
    priority: may
    status: active
    source: back-ported
    acceptance:
      - "An LLM failure returns 500 'AI curation failed' without creating a partial tournament"
      - "filter_value carries a max_length constraint (SEC-012)"
      - "llm_response is nulled by retention after 180 days (FD-011)"
      - "Each AI curation attempt (create or regenerate, success or failure) spends one unit of a shared per-user 50/day budget, counted before the LLM call; beyond it returns 429 (SEC-10, #782)"

  # ── Feedback ────────────────────────────────────────────────────────────

  - id: FD-042
    title: In-app feedback reports
    statement: "When a user submits POST /api/feedback, the system shall accept a title (<=200 chars), description (<=5000 chars) and optional screenshot (<=5 MB; must match JPEG/PNG/GIF/WebP magic bytes), encrypt the screenshot at rest with a 90-day purge_after, and enforce 5 submissions/hour plus a DB-backed cap of 20 per rolling 24 hours (both returning 429; oversize 413; wrong type 415)."
