# Canonical requirements spec. IDs are permanent — never renumber or reuse; append new ones.
#
# Reverse-engineered from the codebase (routers, services, tests, docs/PRD.md,
# docs/TOURNAMENT_SPEC.md, docs/SUGGESTIONS_POOL_SPEC.md, requirements/*.md) on
# 2026-09-07. Statements describe what the system does today; suspected bugs are
# flagged in notes rather than canonized. Needs human review before becoming canon.
meta:
  project: filmduel
  prefix: FD
  ported: 2026-09-07

requirements:
  # ── Authentication & session ────────────────────────────────────────────

  - id: FD-001
    title: Trakt OAuth2 login
    statement: "When a user requests GET /auth/login, the system shall redirect to Trakt's authorize URL using the Authorization Code flow with PKCE (S256) and a random state value, storing state and code verifier in short-lived (300s) httpOnly cookies."
    category: functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "GET /auth/login returns a redirect to trakt.tv containing client_id, redirect_uri, state, code_challenge and code_challenge_method=S256"
      - "filmduel_oauth_state and filmduel_oauth_pkce cookies are set httpOnly, samesite=lax, max_age=300"
      - "GET /auth/callback with a state that does not match the state cookie is rejected"
    notes: "PKCE verifier is 43 URL-safe chars per RFC 7636 §4.1."

  - id: FD-002
    title: SIMKL OAuth2 login (optional provider)
    statement: "While SIMKL_CLIENT_ID is configured, the system shall offer a parallel SIMKL OAuth2 login (/auth/simkl/login, /auth/simkl/callback) so a user may authenticate with SIMKL instead of, or in addition to, Trakt."
    category: functional
    priority: should
    status: active
    source: back-ported
    acceptance:
      - "GET /auth/simkl/login redirects to SIMKL's authorize URL with state and PKCE cookies analogous to the Trakt flow"
      - "A SIMKL-only user row has trakt_user_id NULL and simkl_user_id set"
    notes: "SIMKL tokens are long-lived; refresh is not implemented (a warning is logged near expiry) — see ensure_fresh_simkl_token."

  - id: FD-003
    title: OAuth callback establishes session
    statement: "When the OAuth callback succeeds, the system shall exchange the code for tokens, fetch the provider profile, upsert the user row, issue a signed session JWT as an httpOnly cookie named filmduel_session (prefixed with __Host- when Secure, per FD-048), and redirect to the SPA root."
    category: functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "After a successful callback the response sets filmduel_session (httpOnly, samesite=lax, Secure per FD-041) and redirects to /"
      - "The JWT is HS256-signed with SECRET_KEY and carries sub, jti, iss=filmduel, aud=filmduel, exp, iat, orig_iat"

  - id: FD-004
    title: Bounded sliding session lifetime
    statement: "While a session cookie is presented, the system shall accept JWTs for at most 72 hours per token, re-issue the cookie at most once per 12 hours (carrying orig_iat forward), and reject any session older than 30 days from original login regardless of activity."
    category: non-functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "A request with a token whose iat is more than 12h old receives a fresh Set-Cookie for filmduel_session"
      - "A token whose orig_iat is more than 30 days in the past is rejected with 401 and the cookie is deleted"
      - "Cookie max_age never exceeds the remaining 30-day session budget"

  - id: FD-005
    title: Server-side session revocation on logout
    statement: "When a user calls POST /auth/logout, the system shall set the user's tokens_invalid_before to now, causing every previously issued JWT (any device) to be rejected, and shall delete the session cookie."
    category: functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "POST /auth/logout returns 204 and deletes filmduel_session"
      - "A JWT issued before logout is rejected with 401 'Session revoked' on any subsequent request"

  - id: FD-006
    title: OAuth token encryption at rest
    statement: "When storing Trakt or SIMKL access/refresh tokens, the system shall encrypt them with Fernet using a key derived via HKDF-SHA256 from TOKEN_ENC_KEY (independent of SECRET_KEY)."
    category: non-functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "users table columns store *_token_enc ciphertext, never plaintext tokens"
      - "token_crypto.decrypt_token with a wrong TOKEN_ENC_KEY raises TokenDecryptError (a RuntimeError) rather than returning garbage; a token read through the User model that no configured key decrypts reads as not connected instead (FD-068)"
      - "Startup fails when an OAuth provider client id is configured but TOKEN_ENC_KEY is empty"

  - id: FD-007
    title: Proactive Trakt token refresh
    statement: "When a Trakt API call is about to be made and the stored access token expires within 1 hour, the system shall refresh the token first and persist the new token and expiry on the user row."
    category: functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "ensure_fresh_token refreshes when expires_at - now <= 1h and is a no-op otherwise"
      - "A refresh response missing expires_in falls back to Trakt's documented 90-day TTL"
    notes: "Concurrent background refresh is serialized via SELECT ... FOR UPDATE on the user row (PR #511)."

  # ── Consent, privacy & data lifecycle ───────────────────────────────────

  - id: FD-008
    title: Versioned privacy-policy consent
    statement: "When a user accepts the privacy policy via POST /api/me/consent, the system shall record acceptance only for the current policy version and shall reject unknown versions with 400; a version bump implies stored consent no longer matches and the frontend re-prompts."
    category: functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "POST /api/me/consent with version != CURRENT_PRIVACY_POLICY_VERSION returns 400"
      - "Successful consent sets privacy_policy_accepted=true, privacy_policy_version, and an acceptance timestamp"
      - "GET /api/me exposes privacy_policy_accepted and privacy_policy_version so the SPA can gate access"
    notes: "Current version constant is '2.1' in backend/routers/users.py and must match ConsentModal.jsx."

  - id: FD-009
    title: AI features are consent- and toggle-gated
    statement: "When an AI-backed endpoint (suggestions, AI-curated tournament creation/regeneration) is called, the system shall return 403 unless the user has accepted the privacy policy AND has use_ai_features enabled."
    category: functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "Without policy acceptance the endpoint returns 403 with detail 'Privacy policy consent required'"
      - "With use_ai_features=false the endpoint returns 403 with detail 'AI features are disabled. Enable them in settings to use this feature.'"
      - "use_ai_features defaults to true and is togglable via PATCH /api/me/settings"

  - id: FD-010
    title: Account deletion (GDPR Art. 17)
    statement: "When a user calls DELETE /api/me, the system shall best-effort revoke Trakt/SIMKL tokens upstream, cascade-delete the user row and all dependent rows, delete the session cookie, and return 204."
    category: functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "DELETE /api/me returns 204 and removes the users row plus user_movies, duels, swipe_results, suggestions, tournaments, feedback via ON DELETE CASCADE"
      - "Endpoint is rate-limited to 3/hour per user"

  - id: FD-011
    title: Scheduled data-retention purge
    statement: "While the app is running, the system shall run a daily scheduled purge (default 02:00 UTC, configurable via PURGE_SCHEDULE_HOUR) that moves duels past their retention window (default 180 days) into a minimal duel_history record (user, winner, loser, skip outcome, date) kept until account deletion, deletes swipe results and suggestions past their retention windows (default 180 days), nulls tournament llm_response payloads past 180 days, deletes feedback reports past 365 days, and nulls encrypted screenshots past their purge_after date."
    category: non-functional
    priority: must
    status: active
    source: "PR #502 (SEC-010)"
    acceptance:
      - "APScheduler job 'retention_purge' is registered with the configured cron hour and misfire_grace_time"
      - "Each purge commits independently so one failure does not roll back the others"
      - "Retention windows are configurable via *_RETENTION_DAYS env vars"

  - id: FD-012
    title: Sensitive-data scrubbing in error tracking
    statement: "When an event, transaction or breadcrumb is reported to Sentry, the system shall send no default PII, stack-frame local variables or request bodies, and shall strip query strings and fragments from request, span and HTTP breadcrumb URLs and mask the account segment of /users/<id> paths as '/users/[Filtered]'."
    category: non-functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "sentry_sdk is initialised with send_default_pii=False, include_local_variables=False and max_request_body_size='never'"
      - "before_send and before_send_transaction drop request.query_string and redact request and span URLs; before_breadcrumb drops http.query/http.fragment and redacts the breadcrumb URL"
      - "Redaction removes the query string and fragment and masks /users/<id> as /users/[Filtered]"
      - "Pydantic validation-error 'input' values are stripped before logging"
    notes: "Sentry is enabled only when SENTRY_DSN is set; traces_sample_rate=0.1."

  - id: FD-069
    title: Sensitive-data scrubbing in frontend error tracking
    statement: "When VITE_SENTRY_DSN is configured, the SPA shall initialize Sentry with sendDefaultPii disabled and console and DOM breadcrumbs disabled, and shall strip query strings and fragments from reported event request URLs and from breadcrumb url/from/to fields, and remove the query data and Referer header from reported event requests."
    category: non-functional
    priority: must
    status: active
    source: "PR #723 (#648); issue #860 (req-gap orphan)"
    acceptance:
      - "initSentry with an empty DSN returns false and does not call Sentry.init"
      - "With a DSN, Sentry.init receives sendDefaultPii=false, beforeSend=scrubEvent, beforeBreadcrumb=scrubBreadcrumb, and breadcrumbsIntegration({console: false, dom: false})"
      - "scrubEvent cuts request.url at the first '?' or '#', deletes request.query_string and the Referer/referer header, keeps other headers, and leaves events without a request unchanged"
      - "scrubBreadcrumb cuts the url, from and to breadcrumb data fields at the first '?' or '#' and keeps other fields"
    notes: "Pinned by frontend/src/__tests__/sentry.test.js (initSentry: does nothing without a DSN, initialises with PII off, scrubbing, and no DOM/console breadcrumbs; scrubEvent; scrubBreadcrumb). Implemented in frontend/src/lib/sentry.js (stripQuery, scrubEvent, scrubBreadcrumb, initSentry), called from frontend/src/main.jsx, which also routes React's uncaught, caught and recoverable errors to Sentry.reactErrorHandler only when initSentry returns true. The frontend counterpart of FD-012: query strings carry OAuth code/state and pair tokens, and DOM/console text can contain film titles, which are preference data. VITE_SENTRY_DSN is baked in at build time (Dockerfile ARG, empty by default, which disables frontend Sentry). Unlike FD-012 it does not mask /users/<id> paths, and no tracing sample rate is set, so no transactions are sent."

  - id: FD-064
    title: Duel-rejection logging and spike alerting
    statement: "When a duel submission is rejected (missing, invalid or mismatched pair token, or a submission process_duel refuses), the system shall log the rejection at WARNING with its reason and user id but without movie ids or the outcome, and shall emit at most one ERROR-level spike alert per rolling 5-minute window once the rejections in that window reach 10."
    category: non-functional
    priority: should
    status: active
    source: "issue #855 (req-gap orphan)"
    acceptance:
      - "Each rejection path (missing_pair_token, invalid_pair_token, pair_mismatch, invalid_submission) logs 'duel_rejected reason=<reason> user_id=<id>' at WARNING"
      - "No log record at INFO or above for a rejected duel contains either movie id"
      - "The spike monitor reports when the count of rejections within the window reaches the threshold, and older rejections fall out of the window"
      - "After an alert, no further alert is emitted until the window length has elapsed; a continuing burst then alerts again"
      - "A burst of rejections past the threshold produces exactly one 'duel_rejection_spike' ERROR record"
    notes: "Pinned by backend/tests/test_duel_rejections.py (TestRejectionSpikeMonitor::test_alerts_when_threshold_reached, test_cooldown_suppresses_then_realerts, test_old_rejections_fall_out_of_window; TestRecordDuelRejection::test_logs_warning_with_reason, test_spike_logs_one_error) and the rejection tests in backend/tests/test_duel_router.py via _assert_rejection_logged. Implemented in backend/services/duel_rejections.py (record_duel_rejection, RejectionSpikeMonitor, SPIKE_THRESHOLD=10, SPIKE_WINDOW_SECONDS=300, which is also the alert cooldown), called from backend/routers/duels.py::submit_duel and the RequestValidationError handler in backend/main.py (missing_pair_token). The ERROR reaches Sentry through the SDK's default logging integration and is what drives the alert. Movie ids stay out because a user id paired with preference data must stay at DEBUG (SEC-15). The window lives in process memory (the app runs as a single uvicorn process), so it resets on restart. Introduced in #648 after every duel was silently rejected for three months (#647)."

  # ── Pool ingestion & expansion ──────────────────────────────────────────

  - id: FD-013
    title: Movie pool ingestion from provider sources
    statement: "When a user logs in (or their pool sync cooldown of 1 hour has elapsed), the system shall ingest popular, trending, recommended, watched-history and ratings lists from the connected provider (Trakt and/or SIMKL) for both movies and shows, upserting into the shared movies cache by trakt_id and creating per-user user_movies rows."
    category: functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "Pool population is skipped when last_seen_at is within SYNC_COOLDOWN (1 hour)"
      - "Upsert refreshes shared movie metadata without resetting existing per-user state (seen/elo/battles)"
      - "A failure in one source list does not abort ingestion of the others (_safe_fetch)"

  - id: FD-014
    title: History and ratings import seed user state
    statement: "When provider watch history and ratings are imported, the system shall mark history titles seen=true (Seen-unranked) and set seeded_elo from existing ratings via a linear 1→600 … 10→1400 mapping, leaving elo NULL and battles 0."
    category: functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "trakt_rating_to_seeded_elo(1)==600, (10)==1400, (5)≈956"
      - "Imported rated films still have elo=NULL and battles=0 until their first duel"

  - id: FD-015
    title: TMDB poster backfill
    statement: "When movies are cached without a poster, the system shall backfill poster URLs from TMDB in a background task, and user-facing selection queries (swipe cards, suggestions) shall only surface titles that have a poster."
    category: functional
    priority: should
    status: active
    source: back-ported
    acceptance:
      - "Swipe card and suggestion queries filter poster_url IS NOT NULL"
      - "Poster backfill runs via BackgroundTasks and never blocks the triggering request"

  - id: FD-016
    title: Manual provider re-sync
    statement: "When a user calls POST /api/sync, the system shall refresh provider tokens, bypass the 1-hour sync cooldown, re-populate the pool, and return the number of newly added titles; the endpoint shall be limited to 3 calls per hour per user."
    category: functional
    priority: should
    status: active
    source: back-ported
    acceptance:
      - "POST /api/sync returns {new_movies, total_movies}"
      - "A 4th call within an hour returns 429"

  - id: FD-017
    title: Background pool expansion
    statement: "When a swipe submission leaves the user's unknown pool (seen IS NULL, per media_type) below 50 titles, the system shall enqueue a background expansion task that runs sources in priority order (provider recommendations, TMDB similar-to-top-ranked, provider anticipated, deeper popular pages 2–5) until roughly 100 new titles are added, skipping any source+key run within the last 7 days."
    category: functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "Expansion is triggered from POST /api/swipe/results, not from duels, and never blocks the response"
      - "pool_expansions rows record source, source_key, films_added and guard against re-running a source within 7 days"
      - "Expansion stops early once TARGET_ADDED (100) new titles are reached"
      - "Existing user_movies rows are never reset by expansion; new rows get seen=NULL, elo=NULL, battles=0"

  # ── Swipe (seen/unseen classification) ──────────────────────────────────

  - id: FD-018
    title: Band-weighted swipe card selection
    statement: "When a user requests GET /api/swipe/cards, the system shall return up to 10 unknown titles (seen IS NULL, with posters, scoped by media_type), selecting 6 from the community-rating band matching the user's median ELO, 2 from the band above, 2 from the band below, deduplicating and backfilling randomly when bands run short; with no ranked films yet it shall pick randomly from community-rated titles."
    category: functional
    priority: must
    status: active
    source: "PR #495 (SEC-018) for dedup"
    acceptance:
      - "Response contains at most 10 cards and no duplicate movie ids"
      - "With no unknown titles available the endpoint returns 404 with a message to import more movies"
      - "Bands follow the elite/strong/mid/weak/poor table shared with pair selection (BANDS)"

  - id: FD-019
    title: Bulk swipe result submission
    statement: "When a user submits POST /api/swipe/results, the system shall update user_movies.seen for each submitted movie, record a swipe_results history row per item, skip (and log) movies not in the user's pool, and return seen/unseen counts plus next_action."
    category: functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "Response is {seen_count, unseen_count, next_action} with next_action in {'duel','swipe'}"
      - "movie_id values are validated as UUIDs at the schema layer (SEC-013)"
      - "A movie_id with no user_movies row does not fail the whole submission"

  - id: FD-020
    title: Unseen titles never resurface
    statement: "While a user_movies row has seen=false, the system shall never include that title in swipe cards or duel pairs for that user."
    category: functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "Swipe card query filters seen IS NULL only"
      - "Pair selection only draws from seen=true rows"

  # ── ELO ─────────────────────────────────────────────────────────────────

  - id: FD-021
    title: ELO update formula with uncertainty-aware K-factor
    statement: "When a duel produces a winner, the system shall update both films' ratings using the standard ELO expected-score formula (divisor 400), applying K = 300/sqrt(battles+1) independently to each film based on its battles before the duel, storing ratings unrounded; ratings are rounded to integers only for display in the API."
    category: functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "k_factor(0)==300, k_factor(3)==150 and k_factor(8)==100"
      - "Equal-rated films with 3 battles each exchange 75 points"
      - "Winner and loser K-factors are determined independently from their own battle counts"

  - id: FD-022
    title: ELO is NULL until first ranked duel
    statement: "While a film has battles=0, the system shall keep its elo NULL; when its first winner-producing duel occurs, the calculation shall bootstrap from seeded_elo if present, otherwise 1000."
    category: functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "DB default for user_movies.elo is NULL, not 1000"
      - "get_initial_elo(seeded) returns seeded when set, else 1000"

  - id: FD-023
    title: ELO to 1-10 percentile rating mapping
    statement: "When exporting, syncing or displaying ratings, the system shall map a film's ELO to a 1-10 scale by its mid-rank percentile among the user's ranked films of the same media_type (seen, battles>0), as ceil(10*(below + ties/2)/N) clamped to [1,10]. percentile_rating (backend/services/elo.py) is the single mapping from those counts to a rating, and get_elo_ratings (backend/services/rankings.py) is the single source of the below/ties/N counts, computed in SQL."
    category: functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "Ten films with distinct ELOs rate 1 through 10 in ELO order"
      - "Tied ELOs receive the same rating; a single ranked film rates 5"
      - "The same functions (get_elo_ratings and percentile_rating) and population are used for Trakt sync, Letterboxd CSV Rating10, and rankings display; genre/decade filters do not change a film's rating"
    notes: "#652 replaced the fixed linear mapping round((elo-600)*9/800)+1, which clumped 76% of films at 5-6 because real ELOs span a much narrower range than 600-1400."

  # ── Duels ───────────────────────────────────────────────────────────────

  - id: FD-024
    title: Least-dueled anchor, closest-rated challenger pair selection
    statement: "When a user requests GET /api/movies/pair, the system shall choose the anchor uniformly at random among the seen films with the fewest battles (across all of the user's seen films of that media type, uncapped), choose the challenger uniformly at random among the 5 other seen films closest to the anchor in effective ELO (elo, else seeded/default starting ELO), and avoid an immediate repeat of the previous pair."
    category: functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "Returned pairs never include a seen=false or seen=NULL film"
      - "The anchor always has the minimum battle count among the user's seen films, so battles=0 films (ranked or not) are dueled before any other"
      - "The challenger is always one of the 5 films nearest the anchor's effective ELO"
      - "With fewer than 2 eligible films the endpoint returns 404 (client interprets as 'go swipe')"
      - "When last_pair_token matches the anchor, a different challenger is chosen if one exists"
      - "The frontend requests the next pair only after the current duel is submitted, passing last_pair_token"
    notes: "#650 replaced 1/(battles+1) weighting over ranked-only anchors, band-matched challengers and a 70/30 close/wide split; that selection capped the pool at 500 films and left most films un-dueled."

  - id: FD-025
    title: Tamper-proof pair tokens
    statement: "When a pair is served, the system shall include an encrypted pair token binding the requesting user and the two movie ids, and POST /api/duels shall reject with 400 any submission whose token is missing, undecryptable, expired, issued to a different user, or does not match the submitted movie ids."
    category: non-functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "A duel submission with a forged or mismatched pair_token returns 400 'Invalid pair token'"
      - "A pair_token minted for one user is rejected with 400 'Invalid pair token' when submitted by another user"
      - "A pair_token older than 15 minutes is rejected with 400 'Invalid pair token'"
      - "Tokens are encrypted with the same Fernet key material as token_crypto (not merely encoded)"
    notes: "Prevents clients from submitting duels for arbitrary pairs the server never offered."

  - id: FD-063
    title: Duel submission idempotent on pair-token reuse
    statement: "When a duel is submitted with a pair token that has already been consumed, the system shall reject the request with 409 'Duel already recorded' and shall not apply ELO changes a second time for that token."
    category: functional
    priority: must
    status: active
    source: "issue #854 (req-gap orphan)"
    acceptance:
      - "Re-submitting the same valid pair_token after a successful duel returns 409 'Duel already recorded'"
      - "Both submissions reach process_duel with the same SHA-256 digest of the pair token"
      - "The duels table rejects a second row carrying an already-recorded pair_token_digest; rows without a digest do not collide"
    notes: "Pinned by backend/tests/test_duel_router.py::test_replayed_pair_token_is_rejected_not_applied_twice, backend/tests/test_migration_025_duel_pair_token_digest.py and backend/tests/test_duel_service.py::test_process_duel_records_the_consumed_pair_token; implemented in backend/routers/duels.py::submit_duel (IntegrityError -> rollback -> 409) and the unique index uq_duels_pair_token_digest (backend/db_models.py, migration 025). The ELO update and the duels row are flushed in one transaction, so the rollback discards the replay's ELO change. Introduced in #660 so a client retry after a lost response cannot apply a duel twice."

  - id: FD-026
    title: Duel outcome state machine
    statement: "When POST /api/duels is submitted with one of the outcomes a_wins/b_wins/a_only/b_only/neither, the system shall: for wins, mark both films seen, update ELO for both and increment battles; for X_only, mark the seen film seen=true (if previously unknown) and mark the other seen=false only if it has battles=0; for neither, mark each film seen=false only if it has battles=0."
    category: functional
    priority: must
    status: active
    source: "PR #509 (SEC-004)"
    acceptance:
      - "a_wins/b_wins updates both elos, sets both seen=true, increments both battle counts, and records winner/loser elo before/after on the duels row"
      - "a_only with a ranked (battles>=1) film B leaves B's seen status and elo untouched"
      - "neither on two unranked films sets both to seen=false"
      - "A duels history row is written for every outcome, carrying mode and pair_type"

  - id: FD-027
    title: Self-duel rejection
    statement: "When a duel submission names the same movie for both sides, the system shall reject it with 400 'A movie cannot duel against itself'."
    category: functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "POST /api/duels with movie_a_id == movie_b_id returns 400 with the friendly message (not a raw 422)"

  - id: FD-028
    title: Server-computed next_action
    statement: "When a duel or swipe submission completes, the system shall compute and return next_action='swipe' if the user has fewer than 3 seen-unranked films or fewer than 10 total seen films (scoped by media_type), otherwise 'duel'; the frontend shows a swipe interstitial between duels and never interrupts mid-duel."
    category: functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "compute_next_action returns 'swipe' when seen_unranked < 3 or total_seen < 10"
      - "There is no separate swipe-status polling endpoint"
    notes: "PRD only documents the seen_unranked<3 clause; the total_seen<10 clause exists in code (MIN_TOTAL_SEEN) and is treated as intended."

  - id: FD-029
    title: Concurrent duel safety
    statement: "When processing a duel, the system shall lock both user_movies rows FOR UPDATE in deterministic (sorted UUID) order to prevent deadlocks and lost updates from concurrent submissions."
    category: non-functional
    priority: should
    status: active
    source: back-ported
    acceptance:
      - "process_duel acquires row locks in sorted movie-id order regardless of submission order"

  # ── Rating sync back to providers ───────────────────────────────────────

  - id: FD-030
    title: Opt-in post-duel rating sync
    statement: "When a duel produces a winner, for each provider the user has enabled (sync_ratings_to_trakt, sync_ratings_to_simkl), the system shall push both films' updated 1-10 ratings to that provider as a fire-and-forget background task, refreshing the Trakt token first, retrying once on 5xx, and logging (never surfacing) failures."
    category: functional
    priority: must
    status: active
    source: back-ported
    acceptance:
      - "No sync occurs when sync_ratings_to_trakt=false (the default)"
      - "No SIMKL sync occurs when sync_ratings_to_simkl=false (the default); titles without a SIMKL id are skipped"
      - "A Trakt 5xx triggers exactly one retry; failures are logged/captured without failing the duel response"
      - "The duel API response is not delayed by sync (BackgroundTasks)"
    notes: "SIMKL ratings are keyed by movies.simkl_id; SIMKL has no token refresh flow."

  # ── Rankings & export ───────────────────────────────────────────────────

  - id: FD-031
    title: Rankings list
    statement: "When a user requests GET /api/rankings, the system shall return only films with seen=true and battles>=1, ordered by ELO descending, paginated (default 50, max 200), filterable by genre and decade, scoped by media_type, with each row carrying rank, elo, battles and the derived 1-10 rating."
    category: functional
    priority: must
    status: active
    source: back-ported
    acceptance:
