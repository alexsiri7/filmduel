      - "screenshot_data_enc is Fernet ciphertext, decrypted only for admin listing"
      - "Screenshot encryption failure returns 503 rather than storing plaintext"

  - id: FD-043
    title: Admin-only maintenance endpoints
    statement: "When admin endpoints are called (feedback listing/screenshot scrub/purge, duel/swipe purge), the system shall require a user with is_admin=true (403 otherwise) and rate-limit each endpoint (10/minute)."
    category: functional
    priority: should
    status: active
    source: "PR #498 (SEC-014)"
    acceptance:
      - "A non-admin authenticated user receives 403 'Admin access required'"
      - "Every /admin route carries a limiter decorator"

  - id: FD-059
    title: Owner-side feedback management
    statement: "When an authenticated user calls GET /api/me/feedback, GET /api/me/feedback/{id}/screenshot or DELETE /api/me/feedback/{id}, the system shall operate only on reports they own (404 for any other caller's report, never 403), list report metadata only (newest first, at most 100 per page), serve screenshots as the raw image with Cache-Control: no-store, and refuse deletion with 409 until 24 hours after submission so a deleted report cannot free a slot under FD-042's daily cap; the routes are rate-limited at 30/minute, 10/minute and 30/hour respectively."
    category: functional
    priority: should
    status: active
    source: "issue #850 (req-gap orphan)"
    acceptance:
