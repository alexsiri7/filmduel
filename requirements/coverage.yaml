orphans:
  - behavior: "GET /api/me/export returns a JSON download of every user-scoped record (profile, library, duels, duel_history, tournaments, suggestions, swipe_results, feedback_reports, pool_expansions) from explicit field allow-lists that exclude OAuth tokens, capped at 10,000 rows per section with truncated_sections named, auth-gated only (not consent), 10/hour, linked from the settings sidebar."
    code_paths: ["backend/routers/users.py:247-264", "backend/services/data_export.py", "frontend/src/components/Nav.jsx:176", "backend/tests/test_data_export.py"]
    suggested_requirement: "When an authenticated user requests GET /api/me/export, the system shall return a JSON attachment containing every personal-data record held for them across all user-scoped tables, assembled from explicit field allow-lists that exclude OAuth tokens and expiries, capped at 10,000 rows per section with capped sections named in truncated_sections, available regardless of consent state and limited to 10 exports per hour."
  - behavior: "Initial provider import is started by the first POST /api/me/consent (never the OAuth callback), tracked via pool_import_status (importing/complete/failed, with an import older than 20 minutes reported as failed), retried via POST /api/me/pool-import (3/hour, no-op while importing), and surfaced by a blocking PoolImportScreen that polls /api/me every 3s with Retry / Continue anyway."
    code_paths: ["backend/routers/auth.py:546-550", "backend/routers/users.py:38-55", "backend/routers/users.py:111-210", "backend/schemas.py:23", "frontend/src/App.jsx:68-70", "frontend/src/components/PoolImportScreen.jsx", "backend/tests/test_migration_026_add_pool_import_status.py"]
    suggested_requirement: "When a user accepts the privacy policy for the first time, the system shall start the initial provider import in the background only then (never from the OAuth callback), expose its state via pool_import_status on /api/me (importing / complete / failed, with an import older than 20 minutes reported as failed), and allow POST /api/me/pool-import to retry a failed import at most 3 times per hour."
  - behavior: "Each served pair token's SHA-256 digest is stored on the duels row under a unique index; resubmitting the same token hits IntegrityError and returns 409 'Duel already recorded', which the frontend treats as success on retry."
    code_paths: ["backend/routers/duels.py:62-81", "backend/services/duel.py:227", "backend/db_models.py:311", "backend/db_models.py:337", "frontend/src/pages/Duel.jsx:108-112", "backend/tests/test_migration_025_duel_pair_token_digest.py"]
    suggested_requirement: "When a duel is submitted with a pair token whose digest has already been recorded on a duels row, the system shall reject it with 409 'Duel already recorded' without applying ELO changes a second time, so a client retry after a lost response is safe."
  - behavior: "Swipe submission accepts at most 50 items per request, collapses duplicate movie_ids, updates only rows with seen IS NULL (already-resolved rows are skipped), and returns 429 once 2,000 swipe_results rows exist for the user in a rolling 24h window."
    code_paths: ["backend/routers/swipe.py:37-39", "backend/routers/swipe.py:203-243", "backend/schemas.py:151-152"]
    suggested_requirement: "When a user submits swipe results, the system shall accept at most 50 items per request, collapse repeated movie ids, only update rows still unclassified (seen IS NULL), and reject the submission with 429 once 2,000 swipe results have been recorded for that user in the preceding 24 hours."
  - behavior: "Every count-then-act quota check (swipe daily, feedback daily, tournament daily, suggestion regen, tournament regen/submit/abandon, pool expansion) takes a transaction-scoped pg_advisory_xact_lock keyed on (scope, user or tournament id); handlers that go on to call the LLM use the non-blocking variant and return 429 with Retry-After: 5 when another request of that kind is in flight (SEC-02 / AUD-01)."
    code_paths: ["backend/db.py:51-100", "backend/routers/swipe.py:204", "backend/routers/feedback.py:104", "backend/routers/tournaments.py:210", "backend/routers/tournaments.py:316", "backend/routers/tournaments.py:504", "backend/routers/tournaments.py:554", "backend/routers/suggestions.py:174", "backend/routers/suggestions.py:234", "backend/services/expand.py:59"]
    suggested_requirement: "When a request performs a count-then-act quota check, the system shall serialize it per user (or per tournament) with a transaction-scoped Postgres advisory lock so concurrent requests cannot both pass the cap; and when the request would go on to await an LLM call, the system shall refuse rather than queue, returning 429 with Retry-After if the lock is held."
  - behavior: "Process-wide LLM semaphore of LLM_MAX_CONCURRENT (default 2) with fail-fast LLMBusyError mapped to 503 + Retry-After: 15 on suggestions, regenerate, tournament create and regenerate; per-call LLM_TIMEOUT_SECONDS (<=120s, no retries); startup refuses to boot if the cap is not below DB pool capacity (3 + 2 overflow)."
    code_paths: ["backend/services/llm.py:13-57", "backend/config.py:174-190", "backend/routers/suggestions.py:198-203", "backend/routers/suggestions.py:265-270", "backend/routers/tournaments.py:257-261", "backend/routers/tournaments.py:368-373"]
    suggested_requirement: "While LLM_MAX_CONCURRENT chat completions are already in flight, the system shall reject a new AI request immediately with 503 and Retry-After: 15 rather than queue it, and at startup shall refuse to boot if LLM_MAX_CONCURRENT is not below the database connection pool capacity."
  - behavior: "Suggestion freshness is measured from the newest generated_at including dismissed rows so dismissing cannot force a new LLM generation; status 'all_dismissed' is returned when a fresh batch is fully dismissed; generation per user is single-flight via try_acquire_xact_lock."
    code_paths: ["backend/routers/suggestions.py:102-115", "backend/routers/suggestions.py:169-190", "backend/schemas.py:40", "frontend/src/pages/Suggestions.jsx:94"]
    suggested_requirement: "When GET /api/suggestions decides whether to regenerate, the system shall measure staleness from the newest generated_at for that user and media type including dismissed suggestions, return status 'all_dismissed' when a fresh batch is fully dismissed, and run at most one generation per user at a time."
  - behavior: "GET /api/tournaments/genres returns the distinct genres across the user's ranked films (also used by the Rankings filter pills) and GET /api/tournaments/pool-count returns the matching film count plus max_bracket_size, which the create form uses to clamp the bracket selector."
    code_paths: ["backend/routers/tournaments.py:145-189", "frontend/src/pages/Tournaments.jsx:48-53", "frontend/src/pages/Rankings.jsx:20-30"]
    suggested_requirement: "When a user requests GET /api/tournaments/genres or /pool-count, the system shall return respectively the distinct genres among their ranked films for the media type, and the number of ranked films matching an optional genre/decade filter together with the largest bracket size that pool can fill."
  - behavior: "AI tournament regeneration requires active status, is_ai_curated=true, no played non-bye matches and fewer than 3 prior regenerations (tracked as _regen_count inside llm_response); it deletes and rebuilds all matches with the original theme hint and is serialized against submit/abandon via the tournament_status lock."
    code_paths: ["backend/routers/tournaments.py:299-398"]
