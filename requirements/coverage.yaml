orphans:
  - behavior: "GDPR personal-data export: GET /api/me/export returns every record held about the user as a JSON attachment from explicit allow-lists (no OAuth tokens or expiries), capped at 10,000 rows per section with capped sections named in truncated_sections, not consent-gated, limited to 10/hour."
    code_paths: ["backend/routers/users.py:175-192", "backend/services/data_export.py", "frontend/src/components/Nav.jsx:117", "backend/tests/test_data_export.py"]
    suggested_requirement: "When an authenticated user requests GET /api/me/export, the system shall return a JSON attachment containing their profile, library, duels, tournaments, suggestions, swipe results, feedback reports and pool expansions, built from explicit field allow-lists that exclude OAuth tokens and expiries, capped at 10,000 rows per section with capped sections named in truncated_sections, available regardless of privacy-policy consent and limited to 10 exports per hour per user."
  - behavior: "Privacy-consent gate on core data-producing endpoints: swipe cards, swipe results, duel submission, manual sync and tournament match submission return 403 without privacy_policy_accepted, while pair fetch, rankings, tournament creation and suggestion actions are not gated (FD-009 covers AI endpoints only)."
    code_paths: ["backend/routers/auth.py:230-237", "backend/routers/swipe.py:50", "backend/routers/swipe.py:185", "backend/routers/duels.py:31", "backend/routers/users.py:200", "backend/routers/tournaments.py:473", "backend/tests/test_consent_guard.py:617-769"]
    suggested_requirement: "When a user who has not accepted the current privacy policy calls an endpoint that records preference data (GET /api/swipe/cards, POST /api/swipe/results, POST /api/duels, POST /api/sync, tournament match submission), the system shall reject the request with 403 'Privacy policy consent required'."
  - behavior: "Tournament setup helper endpoints: GET /api/tournaments/genres returns distinct genres across the user's ranked films and GET /api/tournaments/pool-count returns the filtered pool count plus the largest offerable bracket size, both media-type scoped and used by the tournament form and the rankings genre filter."
    code_paths: ["backend/routers/tournaments.py:144-188", "backend/services/tournament.py:86-94", "frontend/src/pages/Tournaments.jsx:65", "frontend/src/pages/Tournaments.jsx:197-205", "frontend/src/pages/Rankings.jsx:19-24"]
    suggested_requirement: "When a user requests GET /api/tournaments/genres or GET /api/tournaments/pool-count, the system shall return, respectively, the sorted distinct genres of their ranked films and the count of ranked films matching the given genre/decade filter together with the largest bracket size (8/16/32/64) not exceeding twice that count, or null when fewer than 4 films match."
  - behavior: "AI tournament regeneration preconditions and cap: regenerate is allowed only for AI-curated tournaments, only before any non-bye match has been played, at most 3 times per tournament (tracked in llm_response._regen_count), reuses the original theme hint and rebuilds all matches; FD-041 only says regeneration is supported."
    code_paths: ["backend/routers/tournaments.py:290-376"]
    suggested_requirement: "When a user calls POST /api/tournaments/{id}/regenerate, the system shall reject with 400 if the tournament is not AI-curated, if any non-bye match has been played, or if 3 regenerations have already occurred; otherwise it shall re-run curation with the original theme hint over the same filtered pool, replace every match, and increment the per-tournament regeneration count."
  - behavior: "Race-safe quota enforcement with Postgres advisory locks (PRs #570, #588): every count-then-act cap (tournament daily cap, tournament regen, suggestion regen, feedback daily cap, swipe daily cap) holds a transaction-scoped advisory lock keyed on the user or tournament, and pool expansion uses a non-blocking try-lock so a concurrent run exits without calling providers."
    code_paths: ["backend/db.py:44-76", "backend/routers/tournaments.py:207", "backend/routers/tournaments.py:303", "backend/routers/tournaments.py:482", "backend/routers/tournaments.py:532", "backend/routers/suggestions.py:190", "backend/routers/feedback.py:90", "backend/routers/swipe.py:194", "backend/services/expand.py:59-65"]
    suggested_requirement: "When enforcing any per-user or per-tournament quota that counts existing rows before acting, the system shall hold a transaction-scoped advisory lock on the (scope, key) pair for the duration of the request so that concurrent requests cannot both pass the cap, and shall skip rather than queue concurrent pool-expansion runs for the same user and media type."
  - behavior: "Shared rate-limit counter storage (PR #594): when RATE_LIMIT_STORAGE_URI is set (redis://, rediss://, redis+unix:// only, validated at startup) limits are stored in Redis with 1-second socket timeouts and in-memory fallback during an outage; when unset on a detected hosted platform a startup warning explains counters are per-process. FD-046 covers keying, not storage."
    code_paths: ["backend/config.py:179-193", "backend/rate_limit.py:42-65", "backend/main.py:96-106"]
    suggested_requirement: "While RATE_LIMIT_STORAGE_URI is configured, the system shall store rate-limit counters in that Redis instance (rejecting non-redis schemes at startup) with bounded 1-second socket timeouts and automatic in-memory fallback during an outage; while it is unset on a detected hosted platform, the system shall log a startup warning that counters are per-process and reset on deploy."
  - behavior: "Behavioral personal data never logged at INFO (PR #583): log lines pairing a user id with preference content (movie ids, duel or swipe outcomes, taste-profile values, next_action) are emitted at DEBUG only, enforced by an AST-based test over the duel, swipe and suggestion modules."
    code_paths: ["backend/routers/duels.py:40-48", "backend/services/duel.py:226-238", "backend/routers/swipe.py:92-93", "backend/routers/swipe.py:246-254", "backend/services/suggest.py:204-210", "backend/tests/test_log_levels.py"]
    suggested_requirement: "The system shall emit any log line that pairs a user identifier with preference data (movie ids, duel or swipe outcomes, ELO or taste-profile values, next_action) at DEBUG level or below, so such data never reaches production log sinks by default."
  - behavior: "Media-type preference persists across sessions (minor): the movies/shows toggle is stored in localStorage under filmduel_media_type, restored on load, and toggles a show-mode body class; FD-034 mentions the toggle but not persistence."
    code_paths: ["frontend/src/App.jsx:66-77"]
    suggested_requirement: "When a user switches the media-type toggle, the SPA shall persist the selection in browser local storage and restore it on the next visit."
  - behavior: "Duel page prefetches the next pair (minor): while a pair is displayed the SPA already fetches the following pair; FD-025's note relies on this to justify the 15-minute token TTL but the behavior itself is unwritten."
    code_paths: ["frontend/src/pages/Duel.jsx:47-68", "frontend/src/pages/Duel.jsx:108"]
    suggested_requirement: "When a duel pair is displayed, the SPA shall prefetch the next pair so that the pair token submitted for the current duel is at most two deliberations old within the 15-minute token lifetime."
