orphans:
  - behavior: "GET /api/me/export returns every user-scoped table as one JSON download built from explicit field allow-lists (never OAuth tokens), capped at 10,000 rows per section with capped sections named in truncated_sections, available without consent, 10/hour."
    code_paths: ["backend/routers/users.py:264-281", "backend/services/data_export.py", "frontend/src/components/Nav.jsx", "backend/tests/test_data_export.py"]
    suggested_requirement: "When an authenticated user requests GET /api/me/export, the system shall return a JSON attachment containing their profile, library, duels, duel history, tournaments, suggestions, swipe results, feedback metadata and pool expansions, built from explicit field allow-lists that exclude all OAuth tokens and expiries, capping each section at 10,000 rows and naming capped sections in truncated_sections, regardless of privacy-policy consent and limited to 10 exports per hour."
  - behavior: "Users can list their own feedback reports (metadata only), fetch one of their screenshots with Cache-Control: no-store, and delete a report, but deletion is refused with 409 inside the 24-hour submission-cap window; foreign reports return 404."
    code_paths: ["backend/routers/users.py:288-411"]
    suggested_requirement: "When an authenticated user calls GET /api/me/feedback, GET /api/me/feedback/{id}/screenshot or DELETE /api/me/feedback/{id}, the system shall operate only on reports they own (404 otherwise), serve screenshots with Cache-Control: no-store, and refuse deletion with 409 until 24 hours after submission so a deleted report cannot free a slot under the daily cap."
  - behavior: "Initial provider import starts on the first consent acceptance (never the OAuth callback), is tracked via pool_import_status with imports older than 20 minutes reported as failed, can be retried via POST /api/me/pool-import (no-op while running, 3/hour), provider fetches retry transient errors twice, and the SPA blocks on a polling PoolImportScreen until complete; supersedes FD-013's login trigger for first login."
    code_paths: ["backend/routers/users.py:54-227", "backend/routers/auth.py:645-649", "backend/services/pool.py:116-157", "backend/services/pool.py:250-307", "frontend/src/components/PoolImportScreen.jsx", "frontend/src/App.jsx"]
    suggested_requirement: "When a user accepts the privacy policy for the first time, the system shall start the initial provider import as a background task only then (never from the OAuth callback), expose its outcome as pool_import_status (importing/complete/failed, with an import older than 20 minutes reported as failed), allow a manual retry via POST /api/me/pool-import at most 3 times per hour, and the SPA shall hold the user on an import screen until the status is complete."
  - behavior: "require_consent guards every endpoint that records new behavioral data (duels, swipe cards/results, feedback, tournament create/match/abandon, suggestion actions, manual sync), while profile, rankings, export, logout and delete deliberately stay available without consent; FD-009 covers only the AI subset."
