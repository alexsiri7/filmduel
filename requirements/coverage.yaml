    suggested_requirement: "When a request would record new behavioral data (duel, swipe, tournament, feedback, suggestion action, manual sync), the system shall return 403 'Privacy policy consent required' unless the user has accepted the current policy version, while profile, rankings, data export, logout and account deletion remain available without consent."
  - behavior: "Trakt users are identified by the immutable account uuid from /users/settings; a legacy slug-only row is adopted only after its stored token proves the same uuid (never an admin row), any other row holding the incoming slug has it released, and a backfill script migrates old rows."
