orphans:
- behavior: GET /api/me/export returns a JSON attachment of all personal data, 10000-row cap per section with truncated_sections, 10/hour, no consent required.
  code_paths: ['backend/routers/users.py:284', backend/services/data_export.py, frontend/src/components/AccountActions.jsx]
  suggested_requirement: When an authenticated user requests GET /api/me/export, the system shall return a JSON attachment (filmduel_data_export.json) containing every personal-data record held for that user — profile, library, duels, duel history, swipes, suggestions, tournaments and matches, feedback reports and pool expansions — capping each section at 10,000 rows and naming any capped section in truncated_sections. The endpoint shall be rate-limited to 10/hour and shall not require privacy-policy consent.
- behavior: DELETE /api/me/consent clears all three consent fields, reverting the user to never-consented; export and deletion stay available; 10/minute.
  code_paths: ['backend/routers/users.py:206', frontend/src/components/AccountActions.jsx, frontend/src/api.js]
  suggested_requirement: When an authenticated user calls DELETE /api/me/consent, the system shall clear privacy_policy_accepted, privacy_policy_accepted_at and privacy_policy_version, so that consent-gated endpoints (FD-073, FD-009) reject the user and the OAuth login skips the provider re-sync until consent is given again. Data export and account deletion shall stay available. The endpoint shall be rate-limited to 10/minute.
- behavior: Daily retention job deletes never-consented, non-admin, unreferenced accounts older than UNCONSENTED_ACCOUNT_RETENTION_DAYS (default 7) after best-effort token revocation.
  code_paths: ['backend/services/retention.py:211', 'backend/scheduler.py:25', 'backend/config.py:387']
  suggested_requirement: While the daily retention purge runs, the system shall delete every non-admin account that has never accepted the privacy policy (no consent fields set, no pool_import_status), was created and last seen more than UNCONSENTED_ACCOUNT_RETENTION_DAYS ago (default 7), and is referenced by no other table. It shall make a best-effort upstream revocation of that account's Trakt and SIMKL tokens.
- behavior: Daily retention job revokes and clears provider tokens of accounts dormant for DORMANT_TOKEN_RETENTION_DAYS (default 90, >30), keeping account data; skips legacy uuid-less Trakt rows.
  code_paths: ['backend/services/retention.py:248', backend/scheduler.py, 'backend/config.py:390']
  suggested_requirement: While the daily retention purge runs, for every account with no sign-in for more than DORMANT_TOKEN_RETENTION_DAYS (default 90, must exceed 30) that still holds provider tokens, the system shall make a best-effort upstream revocation of those Trakt and SIMKL tokens and clear the stored access tokens, refresh tokens and expiries, keeping the account and its data. Legacy Trakt rows without a trakt_uuid that still hold their slug shall be excluded.
- behavior: Operator script backfill_trakt_uuid fills trakt_uuid from /users/settings, clearing trakt_user_id when the token no longer resolves; idempotent.
  code_paths: [backend/scripts/backfill_trakt_uuid.py]
  suggested_requirement: When an operator runs python -m backend.scripts.backfill_trakt_uuid, the system shall, for each user with trakt_uuid NULL and a stored Trakt token, read the account's Trakt profile with that token (refreshing it once on failure) and store its ids.uuid. Where the stored credentials no longer resolve a profile, it shall clear trakt_user_id so the row can never be adopted by slug. Re-running the script shall be safe.
